services:
  apache:
    build:
      context: ./ingress
    container_name: ctf-apache
    ports:
      - "8080:80"
    networks:
      - public_net
    depends_on:
      - web-gateway
      - frontend

  postgres:
    build: ./datastores/postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./datastores/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    # 刻意不設密碼,作為 Stage 3 SSRF 打進來後可直接操作的目標
    networks:
      - internal_net
    # 絕對不對外暴露 port,選手必須靠 SSRF 才能碰到

  web-gateway:
    build: ./web-gateway
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal_net
      - public_net

  frontend:
    build: ./frontend
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    networks:
      - public_net
    depends_on:
      - web-gateway

  image-worker:
    build: ./image-worker
    networks:
      - internal_net

  celery-worker:
    build: ./celery-worker
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
    networks:
      - internal_net
    volumes:
      - ./flags:/flags:ro   # flags 掛進來,但權限在 Dockerfile 裡控制

networks:
  public_net:
    driver: bridge
  internal_net:
    internal: true

volumes:
  pgdata:
