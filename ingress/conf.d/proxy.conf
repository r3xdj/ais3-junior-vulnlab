ProxyPreserveHost On

# CVE 測試路徑: 不要交給 Reverse Proxy
ProxyPass "/cgi-bin/" !
ProxyPass "/debug" !

# API → web-gateway
ProxyPass "/api/" "http://web-gateway:5000/api/"
ProxyPassReverse "/api/" "http://web-gateway:5000/api/"

# 其他 → frontend
ProxyPass "/" "http://frontend:3000/"
ProxyPassReverse "/" "http://frontend:3000/"