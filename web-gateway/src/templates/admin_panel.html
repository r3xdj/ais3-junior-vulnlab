<!DOCTYPE html>
<html>
<head><title>Admin Dashboard</title></head>
<body>
    <h1>Welcome, {{ username }} (Administrator)</h1>

    <h2>Internal Report Viewer</h2>
    <p>Fetch internal service status or reports:</p>
    <form id="fetchForm">
        <input type="text" id="urlInput" placeholder="http://internal-service/status" style="width:400px">
        <button type="submit">Fetch</button>
    </form>
    <pre id="result"></pre>

    <script>
        document.getElementById('fetchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = document.getElementById('urlInput').value;
            const res = await fetch(`/admin/fetch-report?url=${encodeURIComponent(url)}`);
            const data = await res.json();
            document.getElementById('result').textContent = JSON.stringify(data, null, 2);
        });
    </script>
</body>
</html>
