<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}NovaCore Technologies{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">NovaCore</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/product">產品</a>
                <a class="nav-link" href="/about">關於我們</a>
                <a class="nav-link" href="/careers">徵才</a>
                <a class="nav-link" href="/blog">技術部落格</a>
                <a class="nav-link" href="/contact">聯絡我們</a>
                <a class="btn btn-primary btn-sm ms-2" href="/login">登入</a>
            </div>
        </div>
    </nav>

    <main>{% block content %}{% endblock %}</main>

    <footer class="bg-dark text-white-50 py-4 mt-5">
        <div class="container text-center">
            <small>&copy; 2026 NovaCore Technologies Inc. All rights reserved.</small><br>
            <a href="#" class="text-white-50 small">隱私權政策</a> ·
            <a href="#" class="text-white-50 small">服務條款</a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/config.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
