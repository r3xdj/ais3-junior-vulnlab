{% extends "base_app.html" %}
{% block title %}User Dashboard{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="mb-1">User Dashboard</h2>
        <p class="text-muted mb-0">管理你的個人資料、活動紀錄與密碼</p>
    </div>
</div>

<div class="row g-3">
    <div class="col-md-4">
        <div class="card shadow-sm h-100">
            <div class="card-body">
                <h5 class="card-title">Profile</h5>
                <p class="text-muted">更新信箱與顯示名稱</p>
                <a href="/user/profile" class="btn btn-outline-primary">前往</a>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card shadow-sm h-100">
            <div class="card-body">
                <h5 class="card-title">Activity</h5>
                <p class="text-muted">查看最近的帳號活動</p>
                <a href="/user/activity" class="btn btn-outline-primary">前往</a>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card shadow-sm h-100">
            <div class="card-body">
                <h5 class="card-title">Change Password</h5>
                <p class="text-muted">更新密碼並重新登入</p>
                <a href="/user/change-password" class="btn btn-outline-primary">前往</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{{ url_for('static', filename='js/user.js') }}"></script>
{% endblock %}
