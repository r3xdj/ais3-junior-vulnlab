<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIS3 新型態資安暑期營隊 - 榮譽考試報名系統</title>
    <!-- 引入 Bootstrap 5 CSS 與 Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        /* 卡片懸停浮起動畫與游標效果 */
        .hover-card {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            cursor: pointer;
        }
        .hover-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important;
        }
    </style>
</head>
<body class="bg-light">

    <!-- 頂部導覽列 -->
    {% include "public/_navbar.html" %}

    <!-- 主視覺 Banner -->
    <header class="bg-dark text-white py-5 border-bottom border-primary border-4">
        <div class="container text-center my-3">
            <h1 class="display-5 fw-bold">2026 AIS3 榮譽考試報名開始</h1>
            <p class="lead text-white-50">培育國內資安高階實戰人才，挑戰自我資安技術極限！</p>
            <a class="btn btn-primary btn-lg" href="/register">立即註冊帳號並報名</a>
        </div>
    </header>

    <!-- 簡介卡片，可點擊連到各主題頁 -->
    <div class="container py-5">
        <div class="row g-4 text-center">
            <div class="col-md-4">
                <a href="/practice" class="text-decoration-none text-dark">
                    <div class="card shadow-sm border-0 h-100 hover-card">
                        <div class="card-body p-4">
                            <h3 class="fw-bold text-primary mb-2">🛡️ 實戰攻防</h3>
                            <p class="card-text lh-lg text-muted">涵蓋 Web 滲透測試、逆向工程、密碼學與內網橫向移動訓練。</p>
                            <div class="mt-3 text-primary fw-bold small">查看課程範疇 →</div>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-md-4">
                <a href="/ta" class="text-decoration-none text-dark">
                    <div class="card shadow-sm border-0 h-100 hover-card">
                        <div class="card-body p-4">
                            <h3 class="fw-bold text-primary mb-2">🎓 頂尖助教</h3>
                            <p class="card-text lh-lg text-muted">邀集產官學研界頂尖資安專家及導師指導。</p>
                            <div class="mt-3 text-primary fw-bold small">了解師資團隊 →</div>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-md-4">
                <a href="/certification" class="text-decoration-none text-dark">
                    <div class="card shadow-sm border-0 h-100 hover-card">
                        <div class="card-body p-4">
                            <h3 class="fw-bold text-primary mb-2">🏆 榮譽認證</h3>
                            <p class="card-text lh-lg text-muted">通過榮譽考試者將獲得 AIS3 認證證書與進階營隊錄取資格。</p>
                            <div class="mt-3 text-primary fw-bold small">立即報名檢定 →</div>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <!-- 頁尾 -->
    {% include "public/_footer.html" %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
