<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>報名 AIS3 榮譽考試</title>
    <!-- 引入 Bootstrap 5 CSS 與 Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <!-- 頂部導覽列 -->
    {% include "public/_navbar.html" %}

    <!-- 主視覺 Banner -->
    <header class="bg-dark text-white py-5 border-bottom border-primary border-4">
        <div class="container text-center my-3">
            <h1 class="display-5 fw-bold">註冊帳號並報名</h1>
            <p class="lead text-white-50">填寫以下資料，完成 AIS3 榮譽考試報名</p>
        </div>
    </header>

    <!-- 報名卡片 -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <!-- 動態訊息提示框 -->
                        <div id="errorBox" class="mt-2 mb-2 text-danger"></div>

                        <!-- 報名表單 -->
                        <form id="registerForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">使用者名稱 (Username)</label>
                                <input type="text" class="form-control" id="username" name="username" placeholder="請輸入帳號" required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">電子信箱 (Email)</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="example@mail.com" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">設定密碼 (Password)</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="請輸入密碼" required>
                            </div>

                            <div class="mb-3">
                                <label for="exam_type" class="form-label">選擇報名組別</label>
                                <select class="form-select" id="exam_type" name="exam_type">
                                    <option value="web">Web 安全與滲透測試組</option>
                                    <option value="pwn">二進位系統安全 (Pwn) 組</option>
                                    <option value="crypto">密碼學與資安應用組</option>
                                </select>
                            </div>

                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" id="submitBtn" class="btn btn-primary btn-lg">確認送出報名</button>
                                <a href="/" class="btn btn-outline-secondary w-100">← 返回首頁</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 頁尾 -->
    {% include "public/_footer.html" %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 共用的 API 設定與登入/註冊/登出串接邏輯，實際打 web-gateway 的地方。
         注意：web-gateway 的 /api/register 目前只會用到 username / password / email / exam_type。 -->
    <script src="{{ url_for('static', filename='js/config.js') }}"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
