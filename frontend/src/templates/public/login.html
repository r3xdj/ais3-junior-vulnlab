<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學員登入 - AIS3 Student Portal</title>
    <!-- 引入 Bootstrap 5 CSS 與 Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <!-- 頂部導覽列 -->
    {% include "public/_navbar.html" %}

    <!-- 主視覺 Banner -->
    <header class="bg-dark text-white py-5 border-bottom border-primary border-4">
        <div class="container text-center my-3">
            <h1 class="display-5 fw-bold">學員 / 助教登入</h1>
            <p class="lead text-muted">請輸入您的帳號密碼以繼續</p>
        </div>
    </header>

    <!-- 登入卡片 -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <!-- 動態訊息提示框 -->
                        <div id="errorBox" class="mt-2 mb-2 text-danger"></div>

                        <form id="loginForm">
                            <!-- 帳號輸入框 -->
                            <div class="mb-3">
                                <label for="username" class="form-label">帳號 (Username)</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="username" name="username" placeholder="請輸入學員或助教帳號" required>
                                </div>
                            </div>

                            <!-- 密碼輸入框 -->
                            <div class="mb-3">
                                <label for="password" class="form-label">密碼 (Password)</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password" name="password" placeholder="請輸入密碼" required>
                                </div>
                            </div>

                            <!-- 送出按鈕 -->
                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" id="submitBtn" class="btn btn-primary btn-lg">登入系統</button>
                                <a href="/" class="btn btn-outline-secondary w-100">← 返回 Portal 首頁</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 頁尾 -->
    {% include "public/_footer.html" %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 共用的 API 設定與登入/註冊/登出串接邏輯，實際打 web-gateway 的地方 -->
    <script src="{{ url_for('static', filename='js/config.js') }}"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
