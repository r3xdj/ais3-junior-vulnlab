{% extends "base_app.html" %}
{% block admin_tabs %}
{% set current_path = request.path.rstrip('/') %}
<a href="/admin/dashboard" class="nav-link {{ 'active fw-bold' if current_path == '/admin/dashboard' else '' }}">Dashboard</a>
<a href="/admin/reports" class="nav-link {{ 'active fw-bold' if current_path == '/admin/reports' else '' }}">Reports</a>
<a href="/admin/manage-users" class="nav-link {{ 'active fw-bold' if current_path == '/admin/manage-users' else '' }}">Users</a>
{% endblock %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h2 class="mb-1">Change Password</h2>
        <p class="text-muted">請輸入目前密碼與新的密碼</p>
        <form id="passwordForm">
            <div class="mb-3">
                <label for="old_password" class="form-label">Current Password</label>
                <input id="old_password" name="old_password" type="password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="new_password" class="form-label">New Password</label>
                <input id="new_password" name="new_password" type="password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="new_password_confirm" class="form-label">Confirm New Password</label>
                <input id="new_password_confirm" name="new_password_confirm" type="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">更新密碼</button>
            <div id="msgBox" class="mt-3 text-success"></div>
        </form>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{{ url_for('static', filename='js/user.js') }}"></script>
{% endblock %}
