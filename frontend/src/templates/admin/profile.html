{% extends "base_app.html" %}
{% block title %}Profile{% endblock %}
{% block admin_tabs %}
{% set current_path = request.path.rstrip('/') %}
<a href="/admin/dashboard" class="nav-link {{ 'active fw-bold' if current_path == '/admin/dashboard' else '' }}">Dashboard</a>
<a href="/admin/reports" class="nav-link {{ 'active fw-bold' if current_path == '/admin/reports' else '' }}">Reports</a>
<a href="/admin/manage-users" class="nav-link {{ 'active fw-bold' if current_path == '/admin/manage-users' else '' }}">Users</a>
{% endblock %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h2 class="mb-1">Profile</h2>
        <p class="text-muted">更新您的基本資訊</p>
        <form id="profileForm">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input id="email" name="email" type="email" class="form-control">
            </div>
            <div class="mb-3">
                <label for="display_name" class="form-label">Display Name</label>
                <input id="display_name" name="display_name" class="form-control">
            </div>
            <div class="mb-3">
                <label for="exam_type" class="form-label">報名組別</label>
                <input id="exam_type" class="form-control" disabled>
                <div class="form-text">報名時選擇的組別，如需變更請聯繫工作人員。</div>
            </div>
            <button type="submit" class="btn btn-primary">儲存</button>
            <div id="msgBox" class="mt-3 text-success"></div>
        </form>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{{ url_for('static', filename='js/user.js') }}"></script>
{% endblock %}
