<!-- templates/auth/register.html -->
{% extends "base_public.html" %}
{% block title %}註冊{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:400px">
    <h2 class="mb-4">建立帳號</h2>
    <div id="errorBox" class="text-danger mb-2"></div>
    <form id="registerForm">
        <input type="text" name="username" class="form-control mb-2" placeholder="使用者名稱" required>
        <input type="password" name="password" class="form-control mb-3" placeholder="密碼" required>
        <button type="submit" class="btn btn-primary w-100">註冊</button>
    </form>
    <p class="text-center mt-3"><a href="/login">已經有帳號？登入</a></p>
</div>
{% endblock %}
{% block extra_js %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
