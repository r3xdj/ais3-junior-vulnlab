<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Dashboard{% endblock %} - NovaCore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-4">
        <a class="navbar-brand fw-bold" href="/panel">NovaCore</a>

        {% set is_admin_view = request.path.startswith('/admin/') %}
        {% set current_path = request.path.rstrip('/') %}
        <div class="navbar-nav">
            {% block admin_tabs %}{% endblock %}
            <a href="{{ '/admin/profile' if is_admin_view else '/user/profile' }}"
               class="nav-link {{ 'active fw-bold' if current_path == ('/admin/profile' if is_admin_view else '/user/profile') else '' }}">
                Profile
            </a>
            <a href="{{ '/admin/activity' if is_admin_view else '/user/activity' }}"
               class="nav-link {{ 'active fw-bold' if current_path == ('/admin/activity' if is_admin_view else '/user/activity') else '' }}">
                Activity
            </a>
            <a href="{{ '/admin/change-password' if is_admin_view else '/user/change-password' }}"
               class="nav-link {{ 'active fw-bold' if current_path == ('/admin/change-password' if is_admin_view else '/user/change-password') else '' }}">
                Password
            </a>
        </div>

        <div class="ms-auto d-flex align-items-center gap-3">
            <span class="text-muted small" id="usernameLabel"></span>
            <a href="javascript:history.back()" class="btn btn-sm btn-outline-secondary">&larr; 上一頁</a>
            <button id="logoutBtn" class="btn btn-sm btn-outline-danger">登出</button>
        </div>
    </nav>

    <div class="container py-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/config.js') }}"></script>
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
